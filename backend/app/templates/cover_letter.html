<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover Letter — {{ name }}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    font-size: 11pt;
    line-height: 1.6;
    color: #1a1a1a;
    padding: 1in 1.1in;
    max-width: 8.5in;
  }

  .sender-block {
    margin-bottom: 32px;
  }

  .sender-name {
    font-size: 14pt;
    font-weight: 700;
    color: #1a3a5c;
    margin-bottom: 4px;
  }

  .sender-contact {
    font-size: 10pt;
    color: #555;
    line-height: 1.5;
  }

  .date-line {
    font-size: 11pt;
    color: #333;
    margin-bottom: 24px;
  }

  .recipient-block {
    margin-bottom: 24px;
  }

  .recipient-block p {
    font-size: 11pt;
    color: #333;
    line-height: 1.5;
  }

  .salutation {
    font-size: 11pt;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .body-text {
    font-size: 11pt;
    color: #2a2a2a;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .closing {
    margin-top: 28px;
  }

  .closing p {
    font-size: 11pt;
    color: #333;
    margin-bottom: 4px;
  }

  .signature {
    font-size: 12pt;
    font-weight: 700;
    color: #1a3a5c;
    margin-top: 8px;
  }

  @page { size: Letter; margin: 0; }
</style>
</head>
<body>

<div class="sender-block">
  <div class="sender-name">{{ name }}</div>
  <div class="sender-contact">
    {% if contact.email %}{{ contact.email }}<br>{% endif %}
    {% if contact.phone %}{{ contact.phone }}<br>{% endif %}
    {% if contact.location %}{{ contact.location }}{% endif %}
  </div>
</div>

<div class="date-line">{{ date }}</div>

<div class="recipient-block">
  <p>Hiring Manager</p>
  <p>{{ company }}</p>
</div>

<div class="salutation">Dear Hiring Manager,</div>

<div class="body-text">{{ letter_text }}</div>

<div class="closing">
  <p>Sincerely,</p>
  <div class="signature">{{ name }}</div>
</div>

</body>
</html>
